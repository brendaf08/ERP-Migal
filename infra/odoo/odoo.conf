[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
list_db = False
; proxy_mode se mantiene en False porque no se ha verificado una topología
; de proxy inverso confiable en esta instalación. No activar sin confirmar:
; 1) Proxy inverso conocido y controlado (ej. nginx/Traefik/Cloudflare Tunnel con acceso restringido).
; 2) Odoo no recibe conexiones directas que permitan falsificar X-Forwarded-*.
; 3) Configurar proxies confiables compatible con Odoo 19 (proxy_mode=True y parámetros/red confiable
;    según despliegue) para que request.httprequest.remote_addr sea la IP real del cliente.
; 4) No confiar directamente en X-Forwarded-For en código de aplicación; usar remote_addr resuelto por Odoo.
; Mientras proxy_mode=False, el rate limit por IP usa remote_addr tal como llega a Odoo.
proxy_mode = False
; iniciar.py genera /var/lib/odoo/runtime.conf con DB_PASSWORD y ADMIN_PASSWD.
